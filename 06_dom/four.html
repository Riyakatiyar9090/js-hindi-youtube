<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chai aur code | DOM</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <ul class="language">
      <li>Javascript</li>
    </ul>
  </body>
  <script>
    function addLanguage(langName) {
      const li = document.createElement("li");
      li.innerHTML = `${langName}`;
      document.querySelector(".language").appendChild(li);
    }
    addLanguage("python");
    addLanguage("typescript");

    // optimized way to create function above method is time consuming as for every value all steps are repeated again and again
    function addOptiLanguage(langName) {
      const li = document.createElement("li");
      // const addText=document.createTextNode(langName)
      // li.appendChild(addText);
      // instead of writing above two sentence we can write it  directly
      li.appendChild(document.createTextNode(langName));
      document.querySelector(".language").appendChild(li);
    }
    addOptiLanguage("golang");

    //Edit
    const secondLang = document.querySelector("li:nth-child(2)"); // nth-child- we can get any child of the parent by mentioning the child number
    console.log(secondLang);
    //secondLang.innerHTML = "Mojo"   // it first convert the string to DOM and then any other operation performed. so it is not optimisez but we can use it if we are making small scale project
    const newli = document.createElement("li");
    newli.textContent = "Mojo";
    secondLang.replaceWith(newli); // to replace old ones with new ones

    //edit
    const firstLang = document.querySelector("li:first-child");
    firstLang.outerHTML = "<li>TypeScript</li>"; // in outherHTML we have to write whole syntax with text

    //remove
    const lastLang = document.querySelector("li:last-child");
    lastLang.remove();
  </script>
</html>
